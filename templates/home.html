{% extends "base.html" %}

{% block content %}

<h1 class="title">

    Job Application Tracker

</h1>

<p class="subtitle">

    Manage all your job applications in one place.

</p>

<div class="cards">

    <div class="card">

        <h3>Total Applications</h3>

        <h2>{{ total }}</h2>

    </div>

    <div class="card">

        <h3>Applied</h3>

        <h2>{{ applied }}</h2>

    </div>

    <div class="card">

        <h3>Interview</h3>

        <h2>{{ interview }}</h2>

    </div>

    <div class="card">

        <h3>Offer</h3>

        <h2>{{ offer }}</h2>

    </div>

    <div class="card">

        <h3>Accepted</h3>

        <h2>{{ accepted }}</h2>

    </div>

    <div class="card">

        <h3>Rejected</h3>

        <h2>{{ rejected }}</h2>

    </div>

</div>

{% endblock %}
